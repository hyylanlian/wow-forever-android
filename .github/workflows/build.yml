name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null

      - name: Fetch bundled components
        run: bash tools/fetch_components.sh

      # Secrets Gradle 插件没有 local.properties 不配置项目
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleModernDebug
          cp app/build/outputs/apk/modern/debug/app-modern-debug.apk WoW-Forever.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WoW Forever（Battle.net 登录）
          files: WoW-Forever.apk
          prerelease: true
