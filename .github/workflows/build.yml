name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null

      - name: Fetch bundled components
        run: bash tools/fetch_components.sh

      # The ARM64 client never uses Proton's 32-bit Windows half, which is also what antivirus engines flag (#89).
      - name: Remove 32-bit Windows files from Proton
        run: |
          command -v zstd > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd > /dev/null; }
          python3 tools/trim_proton_i386.py app/src/main/assets/bundled_components/proton-11.0-90624-arm64ec.wcp

      # Secrets Gradle 插件没有 local.properties 不配置项目
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Bump version (auto-increment)
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = $(( 248 + ${{ github.run_number }} ))/" app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "2.4.5-ci.${{ github.run_number }}"/' app/build.gradle.kts
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Set up stable debug keystore
        run: |
          mkdir -p ~/.android
          cp keystores/debug.keystore ~/.android/debug.keystore

      - name: Build browser-login helper (ARM64 PE)
        env:
          LLVM_MINGW: llvm-mingw-20261104-msvcrt-ubuntu-22.04-x86_64
          LLVM_MINGW_SHA256: 6e3342e2e0dfa56e9178f3c34b198f278bd5e603db4a759455d1439cc2230630
        run: |
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          sh tools/wow-session-bridge/build.sh "$RUNNER_TEMP/$LLVM_MINGW/bin/aarch64-w64-mingw32-clang" \
            app/src/main/assets/wow-session-bridge.exe
          sha256sum app/src/main/assets/wow-session-bridge.exe

      - name: Build DNS shim (aarch64)
        run: |
          NDK="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64"
          "$NDK/bin/aarch64-linux-android26-clang" -shared -fPIC -O2 \
            -o app/src/main/jniLibs/arm64-v8a/libgamenative_dns_v4mapped.so \
            app/src/main/cpp/gamenative_dns_v4mapped.c -ldl
          sha256sum app/src/main/jniLibs/arm64-v8a/libgamenative_dns_v4mapped.so

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleModernDebug
          cp app/build/outputs/apk/modern/debug/app-modern-debug.apk WoW-Forever.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_CODE=$(( 248 + ${{ github.run_number }} ))
          TAG="build-${{ github.run_number }}-${{ github.run_attempt }}-vc$VERSION_CODE"
          gh release create "$TAG" WoW-Forever.apk \
            --title "WoW Forever（Battle.net 登录）build ${{ github.run_number }}" \
            --prerelease
