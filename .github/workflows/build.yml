name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null

      - name: Fetch bundled components
        run: bash tools/fetch_components.sh

      # Secrets Gradle 插件没有 local.properties 不配置项目
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Bump version (auto-increment)
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = $(( 240 + ${{ github.run_number }} ))/" app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "2.4.0-ci.${{ github.run_number }}"/' app/build.gradle.kts
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Set up stable debug keystore
        run: |
          mkdir -p ~/.android
          cp keystores/debug.keystore ~/.android/debug.keystore

      - name: Build DPAPI launch-options helper (ARM64 PE)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          mkdir -p app/src/main/assets/launch-options
          clang --target=aarch64-pc-windows-msvc -nostdlib -ffreestanding -fuse-ld=lld \
            -Wl,/entry:mainCRTStartup \
            -Wl,/def:tools/launch-options/kernel32.def \
            -Wl,/def:tools/launch-options/crypt32.def \
            -Wl,/def:tools/launch-options/advapi32.def \
            tools/launch-options/wowf-launch-options.c \
            -o app/src/main/assets/launch-options/wowf-launch-options-arm64.exe
          file app/src/main/assets/launch-options/wowf-launch-options-arm64.exe

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleModernDebug
          cp app/build/outputs/apk/modern/debug/app-modern-debug.apk WoW-Forever.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: WoW Forever（Battle.net 登录）build ${{ github.run_number }}
          files: WoW-Forever.apk
          prerelease: true
